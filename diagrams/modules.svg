<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="680" height="780">
  <defs>
    <style>
      .title  { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #1a1a1a; }
      .sub    { font: 13px 'Segoe UI', Arial, sans-serif; fill: #555; }
      .hub    { font: bold 15px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .hubsub { font: 12px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .mlabel { font: bold 13px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .msub   { font: 11px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .role   { font: 11px 'Segoe UI', Arial, sans-serif; fill: #555; }
    </style>
  </defs>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" class="title">Module Overview</text>
  <text x="340" y="54" text-anchor="middle" class="sub">Hub-and-spoke of all modules in src/App.tsx Page type and RBAC roles from PAGE_ALLOWED_ROLES</text>

  <!-- ================================================================
       COLOUR KEY:
         Blue   #5B9BD5  – Admin / management modules
         Green  #4CAF50  – Operations / logistics modules
         Orange #F0A500  – Billing / finance modules
         Purple #9B59B6  – Customer-facing modules
  ================================================================ -->

  <!-- Spoke lines – drawn first so nodes sit on top -->

  <!-- Blue group (top-left area) -->
  <line x1="340" y1="380" x2="130" y2="180" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="90"  y2="295" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="90"  y2="410" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="130" y2="510" stroke="#BDC3C7" stroke-width="1.2"/>

  <!-- Green group (right side) -->
  <line x1="340" y1="380" x2="575" y2="175" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="600" y2="290" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="600" y2="405" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="575" y2="510" stroke="#BDC3C7" stroke-width="1.2"/>

  <!-- Orange group (bottom) -->
  <line x1="340" y1="380" x2="170" y2="620" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="280" y2="670" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="400" y2="670" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="510" y2="620" stroke="#BDC3C7" stroke-width="1.2"/>

  <!-- Purple group (top) -->
  <line x1="340" y1="380" x2="230" y2="130" stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="340" y2="90"  stroke="#BDC3C7" stroke-width="1.2"/>
  <line x1="340" y1="380" x2="450" y2="130" stroke="#BDC3C7" stroke-width="1.2"/>

  <!-- ==================  HUB  ================== -->
  <circle cx="340" cy="380" r="58" fill="#231F20"/>
  <text x="340" y="371" text-anchor="middle" class="hub">Scaffolding</text>
  <text x="340" y="388" text-anchor="middle" class="hub">Rental</text>
  <text x="340" y="405" text-anchor="middle" class="hubsub">Next.js + React</text>

  <!-- ==================  BLUE: Admin / Management  ================== -->

  <!-- User Management -->
  <rect x="56" y="148" width="148" height="64" rx="7" fill="#5B9BD5" stroke="#2D6FA8" stroke-width="1"/>
  <text x="130" y="169" text-anchor="middle" class="mlabel">User Management</text>
  <text x="130" y="185" text-anchor="middle" class="msub">Users, roles, registration</text>
  <text x="130" y="200" text-anchor="middle" class="msub">Roles: admin, super_user</text>

  <!-- Scaffolding Management -->
  <rect x="18" y="262" width="148" height="66" rx="7" fill="#5B9BD5" stroke="#2D6FA8" stroke-width="1"/>
  <text x="92" y="282" text-anchor="middle" class="mlabel">Scaffolding</text>
  <text x="92" y="298" text-anchor="middle" class="mlabel">Management</text>
  <text x="92" y="314" text-anchor="middle" class="msub">Inventory, items, pricing</text>

  <!-- RFQ Management -->
  <rect x="18" y="376" width="148" height="66" rx="7" fill="#5B9BD5" stroke="#2D6FA8" stroke-width="1"/>
  <text x="92" y="396" text-anchor="middle" class="mlabel">RFQ Management</text>
  <text x="92" y="412" text-anchor="middle" class="msub">Quotations, extensions</text>
  <text x="92" y="428" text-anchor="middle" class="msub">Roles: sales, admin</text>

  <!-- Rental Agreement -->
  <rect x="56" y="478" width="148" height="66" rx="7" fill="#5B9BD5" stroke="#2D6FA8" stroke-width="1"/>
  <text x="130" y="498" text-anchor="middle" class="mlabel">Rental Agreement</text>
  <text x="130" y="514" text-anchor="middle" class="msub">Agreements, versions</text>
  <text x="130" y="530" text-anchor="middle" class="msub">Signatures, extensions</text>

  <!-- ==================  GREEN: Operations / Logistics  ================== -->

  <!-- Delivery Management -->
  <rect x="510" y="143" width="150" height="64" rx="7" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
  <text x="585" y="164" text-anchor="middle" class="mlabel">Delivery</text>
  <text x="585" y="180" text-anchor="middle" class="mlabel">Management</text>
  <text x="585" y="196" text-anchor="middle" class="msub">8-step DO workflow</text>

  <!-- Return Management -->
  <rect x="534" y="257" width="148" height="66" rx="7" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
  <text x="608" y="277" text-anchor="middle" class="mlabel">Return</text>
  <text x="608" y="293" text-anchor="middle" class="mlabel">Management</text>
  <text x="608" y="309" text-anchor="middle" class="msub">8-step return workflow</text>

  <!-- Inspection & Maintenance -->
  <rect x="534" y="372" width="150" height="66" rx="7" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
  <text x="609" y="392" text-anchor="middle" class="mlabel">Inspection &amp;</text>
  <text x="609" y="408" text-anchor="middle" class="mlabel">Maintenance</text>
  <text x="609" y="424" text-anchor="middle" class="msub">Condition reports, repairs</text>

  <!-- Project Closure -->
  <rect x="510" y="478" width="148" height="66" rx="7" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
  <text x="584" y="498" text-anchor="middle" class="mlabel">Project Closure</text>
  <text x="584" y="514" text-anchor="middle" class="msub">3-gate validation</text>
  <text x="584" y="530" text-anchor="middle" class="msub">PCR-YYYY-NNN</text>

  <!-- ==================  ORANGE: Billing / Finance  ================== -->

  <!-- Billing Dashboard -->
  <rect x="96" y="590" width="148" height="66" rx="7" fill="#F0A500" stroke="#B8750A" stroke-width="1"/>
  <text x="170" y="610" text-anchor="middle" class="mlabel">Billing Dashboard</text>
  <text x="170" y="626" text-anchor="middle" class="msub">Overview, recent activity</text>
  <text x="170" y="642" text-anchor="middle" class="msub">Roles: admin, finance</text>

  <!-- Monthly Rental -->
  <rect x="208" y="638" width="140" height="66" rx="7" fill="#F0A500" stroke="#B8750A" stroke-width="1"/>
  <text x="278" y="658" text-anchor="middle" class="mlabel">Monthly Rental</text>
  <text x="278" y="674" text-anchor="middle" class="mlabel">Billing</text>
  <text x="278" y="690" text-anchor="middle" class="msub">Auto invoices, overdue</text>

  <!-- Deposits / Credit Notes / Refunds / Charges -->
  <rect x="332" y="638" width="136" height="66" rx="7" fill="#F0A500" stroke="#B8750A" stroke-width="1"/>
  <text x="400" y="658" text-anchor="middle" class="mlabel">Deposits, Credit</text>
  <text x="400" y="674" text-anchor="middle" class="mlabel">Notes &amp; Refunds</text>
  <text x="400" y="690" text-anchor="middle" class="msub">Security deposit, CN, refunds</text>

  <!-- Reports -->
  <rect x="436" y="590" width="148" height="66" rx="7" fill="#F0A500" stroke="#B8750A" stroke-width="1"/>
  <text x="510" y="610" text-anchor="middle" class="mlabel">Report Generation</text>
  <text x="510" y="626" text-anchor="middle" class="msub">9 report types: financial,</text>
  <text x="510" y="642" text-anchor="middle" class="msub">inventory, rental, credit…</text>

  <!-- ==================  PURPLE: Customer-Facing  ================== -->

  <!-- Customer Portal -->
  <rect x="160" y="98" width="140" height="64" rx="7" fill="#9B59B6" stroke="#6C3483" stroke-width="1"/>
  <text x="230" y="119" text-anchor="middle" class="mlabel">Customer Portal</text>
  <text x="230" y="135" text-anchor="middle" class="msub">RFQ, agreements, billing,</text>
  <text x="230" y="151" text-anchor="middle" class="msub">returns (customer role)</text>

  <!-- Statement of Account -->
  <rect x="270" y="62" width="140" height="56" rx="7" fill="#9B59B6" stroke="#6C3483" stroke-width="1"/>
  <text x="340" y="82" text-anchor="middle" class="mlabel">Statement of</text>
  <text x="340" y="98" text-anchor="middle" class="mlabel">Account</text>
  <text x="340" y="112" text-anchor="middle" class="msub">SOA per agreement</text>

  <!-- Content Management -->
  <rect x="380" y="98" width="140" height="64" rx="7" fill="#9B59B6" stroke="#6C3483" stroke-width="1"/>
  <text x="450" y="119" text-anchor="middle" class="mlabel">Content</text>
  <text x="450" y="135" text-anchor="middle" class="mlabel">Management</text>
  <text x="450" y="151" text-anchor="middle" class="msub">About, FAQ, terms, blogs</text>

  <!-- ==================  LEGEND  ================== -->
  <rect x="30" y="718" width="14" height="14" rx="2" fill="#5B9BD5"/>
  <text x="50" y="730" class="role">Admin / Management</text>
  <rect x="195" y="718" width="14" height="14" rx="2" fill="#4CAF50"/>
  <text x="215" y="730" class="role">Operations / Logistics</text>
  <rect x="370" y="718" width="14" height="14" rx="2" fill="#F0A500"/>
  <text x="390" y="730" class="role">Billing / Finance</text>
  <rect x="505" y="718" width="14" height="14" rx="2" fill="#9B59B6"/>
  <text x="525" y="730" class="role">Customer-facing</text>

  <text x="30" y="758" class="sub" font-size="11" font-family="'Segoe UI', Arial, sans-serif" fill="#888">Sources: src/App.tsx (Page type, PAGE_ALLOWED_ROLES, DEFAULT_PAGE_ORDER), app/api/* directory structure</text>
  <text x="30" y="772" class="sub" font-size="11" font-family="'Segoe UI', Arial, sans-serif" fill="#888">Additional Charges module merged into Billing group; delivery-return-requests is a combined request list view</text>
</svg>
